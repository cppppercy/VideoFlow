[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoflow"
version = "0.4.1"
description = "本地媒体、B 站音频与已授权课程回放转录工具"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "VideoFlow contributors" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  # PyAV 19 移除了 faster-whisper 1.x 解码时仍传入的 metadata_errors 参数。
  "av>=11,<19",
  "gradio>=5,<7",
  "yt-dlp==2026.8.19",
  # Windows WASAPI 回环录制当前默认扬声器声音；不访问网页账号或视频流。
  "SoundCard>=0.4,<0.5",
  # 代理环境使用 SOCKS_PROXY 时，Gradio/httpx 仍可正常启动。
  "httpx[socks]>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
videoflow = "videoflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
