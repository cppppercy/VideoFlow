[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoflow"
version = "0.2.0"
description = "本地媒体转录与 B 站已有字幕提取工具"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "VideoFlow contributors" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  # PyAV 19 移除了 faster-whisper 1.x 解码时仍传入的 metadata_errors 参数。
  "av>=11,<19",
  "gradio>=5,<7",
  "yt-dlp==2026.8.19",
  # 代理环境使用 SOCKS_PROXY 时，Gradio/httpx 仍可正常启动。
  "httpx[socks]>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
videoflow = "videoflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
