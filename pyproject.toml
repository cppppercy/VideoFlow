[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoflow"
version = "0.5.0"
description = "本地媒体、B 站音频与已授权课程回放转录工具"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "VideoFlow contributors" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  # PyAV 19 移除了 faster-whisper 1.x 解码时仍传入的 metadata_errors 参数。
  "av>=11,<19",
  "gradio>=5,<7",
  "yt-dlp==2026.8.19",
  # Windows WASAPI 回环录制当前默认扬声器声音；不访问网页账号或视频流。
  "SoundCard>=0.4,<0.5",
  # 本地确定性繁转简；保证中文预览、TXT 与 SRT 统一使用简体字。
  "opencc-python-reimplemented==0.1.7",
  # 仅用于本地课程词表的拼音近似候选；模糊候选不会自动改写正文。
  "pypinyin>=0.53,<1",
  # 代理环境使用 SOCKS_PROXY 时，Gradio/httpx 仍可正常启动。
  "httpx[socks]>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gpu = [
  # Windows 可选 GPU 运行库；不让没有 NVIDIA 显卡的用户承担约 1 GB 下载。
  "nvidia-cublas-cu12==12.6.4.1; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.5.0.50; sys_platform == 'win32'",
]
chinese-review = [
  # 可选中文第二识别器；只复核少量 Whisper 可疑片段，不替换默认路径。
  "funasr==1.4.16",
  # torch 与 torchaudio 必须使用同一发行版本，避免音频扩展加载失败。
  "torch==2.11.0",
  "torchaudio==2.11.0",
]

[project.scripts]
videoflow = "videoflow.cli:main"
videoflow-benchmark = "videoflow.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
